name: Build

# Every push and pull request is built, to check that the project compiles. A tag (v1.0, v1.1...) also publishes the
# release: the zip, the two ELFs attached loose (SD2Cloud's own updater downloads those), SHA256SUMS.txt and the notes.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # the ps2dev toolchain (ps2sdk, ps2sdk-ports, gsKit) the releases are built and tested with, pinned by digest, so
    # that every build links the same SDK
    container: ps2dev/ps2dev@sha256:c64ae69c9817865ed98ff054e4ae5360b9e280ed952c97946bca95d9d35be995
    steps:
      # tar: actions/cache needs GNU tar to save, the image only has BusyBox's
      - name: Install the build tools
        run: apk add --no-cache build-base cmake git python3 tar zip

      - uses: actions/checkout@v4

      # wolfSSL and curl with 4096-bit RSA (tools/build_ports.sh): built once, then kept
      - uses: actions/cache@v4
        id: ports
        with:
          path: ports4096
          key: ports4096-c64ae69c-${{ hashFiles('tools/build_ports.sh') }}

      - name: Build wolfSSL and curl
        if: steps.ports.outputs.cache-hit != 'true'
        run: sh tools/build_ports.sh

      # the sd2psx driver (tools/build_mmceman.sh): the mmceman in the image is older than its sio2man and can hang
      # the sd2psx, so the program embeds this one
      - name: Build mmceman
        run: sh tools/build_mmceman.sh

      # The Google OAuth client comes from the repository's secrets. A pull request from a fork has no access to them:
      # it gets placeholders, enough to check that the code compiles (that build cannot sign in to Google)
      - name: Write src/credentials.h
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf '#define GOOGLE_CLIENT_ID "%s"\n#define GOOGLE_CLIENT_SECRET "%s"\n' \
            "${GOOGLE_CLIENT_ID:-placeholder}" "${GOOGLE_CLIENT_SECRET:-placeholder}" > src/credentials.h

      - name: Build
        run: make

      - name: Package
        run: python3 tools/make_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: SD2Cloud
          if-no-files-found: error
          path: |
            dist/SD2Cloud-v*.zip
            dist/SD2CLOUD.ELF
            dist/SD2CLOUD-IGR.ELF
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SD2Cloud
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SD2Cloud ${GITHUB_REF_NAME#v}" --notes-file dist/RELEASE-NOTES.md \
            dist/SD2Cloud-v*.zip dist/SD2CLOUD.ELF dist/SD2CLOUD-IGR.ELF dist/SHA256SUMS.txt
