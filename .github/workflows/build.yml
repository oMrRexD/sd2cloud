name: Build

# Every push and pull request is built, to check that the project compiles. A tag (v1.0, v1.1...) also publishes the
# release: the zip, the two ELFs attached loose (SD2Cloud's own updater downloads those), SHA256SUMS.txt and the notes.
# (The Save Application System package, APP_SD2CLOUD.psu, is inside the zip: it is of no use without the program.) A push to main also publishes the same files as the
# "beta" pre-release, in place of the one before it: SD2Cloud's beta update channel. The beta also carries the debug
# build of the program (SD2CLOUD-DEBUG.ELF), which keeps a log: for whoever is asked for one about a problem.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # the ps2dev toolchain (ps2sdk, ps2sdk-ports, gsKit) the releases are built and tested with, pinned by digest, so
    # that every build links the same SDK
    container: ps2dev/ps2dev@sha256:c64ae69c9817865ed98ff054e4ae5360b9e280ed952c97946bca95d9d35be995
    steps:
      # tar: actions/cache needs GNU tar to save, the image only has BusyBox's
      - name: Install the build tools
        run: apk add --no-cache build-base cmake git python3 tar zip

      - uses: actions/checkout@v4

      # wolfSSL and curl with 4096-bit RSA (tools/build_ports.sh): built once, then kept
      - uses: actions/cache@v4
        id: ports
        with:
          path: ports4096
          key: ports4096-c64ae69c-${{ hashFiles('tools/build_ports.sh') }}

      - name: Build wolfSSL and curl
        if: steps.ports.outputs.cache-hit != 'true'
        run: sh tools/build_ports.sh

      # the sd2psx driver (tools/build_mmceman.sh): the mmceman in the image is older than its sio2man and can hang
      # the sd2psx, so the program embeds this one
      - name: Build mmceman
        run: sh tools/build_mmceman.sh

      # The Google OAuth client comes from the repository's secrets. A pull request from a fork has no access to them:
      # it gets placeholders, enough to check that the code compiles (that build cannot sign in to Google)
      - name: Write src/credentials.h
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf '#define GOOGLE_CLIENT_ID "%s"\n#define GOOGLE_CLIENT_SECRET "%s"\n' \
            "${GOOGLE_CLIENT_ID:-placeholder}" "${GOOGLE_CLIENT_SECRET:-placeholder}" > src/credentials.h

      # the commit goes into the program ("About" shows it): given here, so that git isn't asked inside the container
      - name: Build
        run: make APP_COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)"

      # the debug build (the Makefile says what it does differently): every build checks that it compiles too, and the
      # beta publishes it
      - name: Build the debug program
        run: make DEBUG=1 APP_COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)"

      - name: Package
        run: python3 tools/make_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: SD2Cloud
          if-no-files-found: error
          path: |
            dist/SD2Cloud-v*.zip
            dist/SD2CLOUD.ELF
            dist/SD2CLOUD-IGR.ELF
            dist/SD2CLOUD-DEBUG.ELF
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SD2Cloud
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SD2Cloud ${GITHUB_REF_NAME#v}" --notes-file dist/RELEASE-NOTES.md \
            dist/SD2Cloud-v*.zip dist/SD2CLOUD.ELF dist/SD2CLOUD-IGR.ELF dist/SHA256SUMS.txt

  # The beta channel: what was just built from main, as a pre-release under the fixed tag "beta", made again at every
  # push (the release before it is deleted with its tag, and the new one is created on this commit). SD2Cloud looks at
  # it only when its settings say "Update channel: Beta". The versions from before that setting ask GitHub for "the
  # latest release", which is never a pre-release, and compare tags by their numbers, which "beta" doesn't have.
  beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: beta
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SD2Cloud
          path: dist

      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # main moved on while this was building: the push that moved it publishes, not this one
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "main is past $GITHUB_SHA: nothing published"
            exit 0
          fi
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          # the zip is named after the version in the source, which the release it came from already has: here it is the beta's
          mv dist/SD2Cloud-v*.zip dist/SD2Cloud-beta.zip
          sed -i 's/  SD2Cloud-v.*\.zip$/  SD2Cloud-beta.zip/' dist/SHA256SUMS.txt
          (cd dist && sha256sum SD2CLOUD-DEBUG.ELF >> SHA256SUMS.txt)
          {
            printf 'Built automatically from the latest change to `main` ([`%s`](https://github.com/%s/commit/%s)):\n\n' "$short" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '> %s\n\n' "$(printf '%s\n' "$MESSAGE" | head -n 1)"
            printf 'This is the **beta channel**: every change comes out here before it is tested the way a version is, so it may have bugs. The stable version is the release marked "Latest".\n\n'
            printf 'To get the betas from SD2Cloud itself: Settings > Update channel > Beta. Choosing Stable there again offers the way back.\n\n'
            printf '`SD2CLOUD-DEBUG.ELF` is this same build with a log, for reporting a problem: copy it to the microSD and open it as any program (the Files tab of SD2Cloud opens it); when it closes, it writes `SD2Cloud/debug-log.txt` there. It keeps its own state and its own folder on Drive, so it asks about the first sync again and leaves the real backups alone. IGR and the shortcut on the memory card go on opening the normal SD2Cloud.\n\n'
            printf -- '---\n\n'
            printf '**Canal beta:** compilado automaticamente a cada alteração, antes dos testes que uma versão recebe; pode ter erros. A versão estável é a release marcada como "Latest". Para receber as betas pelo próprio SD2Cloud: Configurações > Canal de atualização > Beta.\n\n'
            printf '**`SD2CLOUD-DEBUG.ELF`:** esta mesma compilação com log, para relatar um problema. Copie para o microSD e abra como qualquer programa (a aba Arquivos do SD2Cloud abre); ao fechar, ela grava `SD2Cloud/debug-log.txt` lá. Ela usa um estado e uma pasta no Drive próprios: pergunta de novo sobre a primeira sincronização e não mexe nos backups de verdade. O IGR e o atalho do memory card continuam abrindo o SD2Cloud normal.\n\n'
            printf '| File | SHA-256 |\n|---|---|\n'
            awk '{ printf "| %s | `%s` |\n", $2, $1 }' dist/SHA256SUMS.txt
          } > beta-notes.md
          gh release delete beta --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          # and a "beta" tag left without its release, which the new one would otherwise be attached to as it is
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/beta" > /dev/null 2>&1 || true
          gh release create beta --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "SD2Cloud beta ($short)" --notes-file beta-notes.md \
            dist/SD2Cloud-beta.zip dist/SD2CLOUD.ELF dist/SD2CLOUD-IGR.ELF dist/SD2CLOUD-DEBUG.ELF dist/SHA256SUMS.txt
