; ==============================================================================
;  sd2cloud.example.ini
;
;  EN: This file is only an example: SD2Cloud never reads it. It explains every
;      option of sd2cloud.ini, with its default value. To change an option,
;      edit it in sd2cloud.ini (on a PC, or in the Settings screen of SD2Cloud).
;      Lines that start with ; are comments.
;  PT: Este arquivo é apenas um exemplo: o SD2Cloud nunca o lê. Ele explica cada
;      opção do sd2cloud.ini, com o valor padrão. Para alterar uma opção,
;      edite-a no sd2cloud.ini (no PC ou na tela de Configurações do SD2Cloud).
;      Linhas iniciadas por ; são comentários.
; ==============================================================================


[general]

; EN: Interface language: auto (the PS2 system language), en or pt.
; PT: Idioma da interface: auto (o idioma do sistema do PS2), en ou pt.
language = auto

; EN: Google Drive folder where the backups are stored.
; PT: Pasta do Google Drive onde os backups são armazenados.
drive_folder = PS2 Memory Card Backups


[cards]

; EN: Which memory cards are synced: auto (every card of the types below) or
;     list (only the cards in "include").
; PT: Quais cartões de memória são sincronizados: auto (todos os cartões dos
;     tipos abaixo) ou list (somente os cartões informados em "include").
mode = auto

; EN: Card types, separated by commas: normal (Card1, Card2...), gameid (one
;     card per game), named (folders with custom names), boot (the BootCards).
; PT: Tipos de cartão, separados por vírgula: normal (Card1, Card2...), gameid
;     (um cartão por jogo), named (pastas com nome personalizado), boot (os
;     BootCards).
types = normal, gameid, named

; EN: With mode = list: the cards to sync, separated by commas. Each one can be
;     folder/card (Card1/Card1-1), a card (Card1-1) or a folder (Card1).
; PT: Com mode = list: os cartões a sincronizar, separados por vírgula. Cada um
;     pode ser pasta/cartão (Card1/Card1-1), um cartão (Card1-1) ou uma pasta
;     (Card1).
include =

; EN: With mode = auto: the cards to leave out, in the same format.
; PT: Com mode = auto: os cartões a deixar de fora, no mesmo formato.
exclude =

; EN: The file a card's backup holds: mcd (the sd2psx's own format) or ps2 (the same card with the error
;     correction bytes a real memory card has, which is the format PCSX2 uses: take the .ps2 out of the zip and
;     put it in PCSX2's memory card folder). Either one can be restored, whatever is set here.
; PT: O arquivo que o backup de um cartão guarda: mcd (o formato do próprio sd2psx) ou ps2 (o mesmo cartão com os
;     bytes de correção de erros que um cartão de memória de verdade tem, que é o formato usado pelo PCSX2: tire
;     o .ps2 de dentro do zip e coloque na pasta de cartões de memória do PCSX2). Os dois podem ser restaurados,
;     seja qual for a opção escolhida aqui.
format = mcd


[retention]

; EN: Backups kept per card (0 = all of them). The oldest one is removed only
;     after the new one has been verified.
; PT: Backups mantidos por cartão (0 = todos). O mais antigo só é removido
;     depois que o novo é verificado.
default = 10

; EN: A different number for one card or folder: add a line with its name.
;     The two lines below are examples.
; PT: Uma quantidade diferente para um cartão ou uma pasta: acrescente uma linha
;     com o nome. As duas linhas abaixo são exemplos.
Card1/Card1-1 = 20
BOOT = 3


[igr]

; EN: Program opened after the automatic sync (IGR): auto (the OPL found on the
;     microSD), osd (the PS2 menu) or the path to a program, starting with its
;     device: mmce?:/ (sd2psx), mc?:/ (memory card), mass:/ (USB), mx4sio:/,
;     ata:/ (HDD, exFAT) or hdd0:PARTITION:pfs:/ (HDD, APA).
;     Example: mmce?:/APPS/OPL/OPNPS2LD.ELF
; PT: Programa aberto depois da sincronização automática (IGR): auto (o OPL
;     encontrado no microSD), osd (o menu do PS2) ou o caminho de um programa,
;     começando pelo dispositivo: mmce?:/ (sd2psx), mc?:/ (cartão de memória),
;     mass:/ (USB), mx4sio:/, ata:/ (HD exFAT) ou hdd0:PARTIÇÃO:pfs:/ (HD APA).
;     Exemplo: mmce?:/APPS/OPL/OPNPS2LD.ELF
return = auto

; EN: The name shown on screen for the program in "return", when it is a path
;     (empty = a name taken from the path). When another program is chosen in
;     the Settings screen, SD2Cloud clears it.
; PT: O nome exibido na tela para o programa de "return", quando é um caminho
;     (vazio = um nome tirado do caminho). Quando outro programa é escolhido na
;     tela de Configurações, o SD2Cloud apaga este nome.
name =

; EN: Seconds to wait for the sd2psx to finish writing the game's memory card.
; PT: Segundos de espera para o sd2psx terminar de gravar o cartão do jogo.
settle_seconds = 3

; EN: Seconds the summary stays on screen when an upload fails (0 = do not
;     show it).
; PT: Segundos em que o resumo fica na tela quando um envio falha (0 = não
;     exibir).
summary_seconds = 3


[manual]

; EN: Program selected first in the exit menu: auto, osd or a path, as in [igr].
;     SD2Cloud keeps the last choice here.
; PT: Programa selecionado primeiro no menu de saída: auto, osd ou um caminho,
;     como em [igr]. O SD2Cloud guarda aqui a última escolha.
return = auto

; EN: The name shown in the exit menu for the program in "return", when it is a
;     path (empty = a name taken from the path). When another program is chosen
;     in the exit menu, SD2Cloud clears it.
; PT: O nome exibido no menu de saída para o programa de "return", quando é um
;     caminho (vazio = um nome tirado do caminho). Quando outro programa é
;     escolhido no menu de saída, o SD2Cloud apaga este nome.
name =


[app]

; EN: This section is not in sd2cloud.ini at first. SD2Cloud adds it by itself
;     when it needs to: where SD2Cloud is installed, for the IGR helper (when it
;     is not in APPS/SD2Cloud), and its version (when it is also opened from
;     another device). There is no need to edit these.
; PT: Esta seção não vem no sd2cloud.ini. O próprio SD2Cloud a acrescenta
;     quando precisa: onde o SD2Cloud está instalado, para o assistente de IGR
;     (quando não está em APPS/SD2Cloud), e a versão dele (quando também é
;     aberto a partir de outro dispositivo). Não é preciso editar.
app_path = mmce?:/APPS/SD2Cloud/SD2CLOUD.ELF
app_version = 1.0
